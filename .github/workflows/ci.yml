name: CI

# Release packaging runs from application-packaging.yml on v* tags.
# This workflow only builds and tests, so regressions are caught on
# ordinary commits and pull requests rather than at release time.
on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Maven verify
        run: mvn -B verify
